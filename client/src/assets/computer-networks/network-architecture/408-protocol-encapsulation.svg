<text x="1040" y="915" font-size="27" fill="#93631e" font-weight="700" text-anchor="middle">广域网</text>
<text x="1040" y="947" font-size="21" fill="#826741" font-weight="400" text-anchor="middle">PPP 等点对点链路</text>
<text x="1318" y="891" font-size="18" fill="#826741" font-weight="400" text-anchor="middle">本地地址解析</text>
<rect x="1244" y="906" width="148" height="58" rx="10" fill="#fff1cc" stroke="#e7d3a6" stroke-width="1.6"/>
<text x="1318" y="945" font-size="28" fill="#93631e" font-weight="700" text-anchor="middle">ARP</text>
<text x="32" y="1025" font-size="21" fill="#526680" font-weight="400" text-anchor="start">DNS 在两组中出现：支持 UDP 与 TCP，服务端口均为 53。</text>
<text x="32" y="1061" font-size="20" fill="#526680" font-weight="400" text-anchor="start">* FTP：21 为控制端口，20 为主动方式数据连接的服务器端口；DHCP：67 服务器 / 68 客户端。</text>
<text x="32" y="1094" font-size="20" fill="#526680" font-weight="400" text-anchor="start">1 / 17 / 6 / 89 是 IPv4 协议号，不是端口号；ARP 不封装在 IP 数据报中。</text>
<text x="32" y="1146" font-size="28" fill="#19324f" font-weight="700" text-anchor="start">TCP/IP 各层功能</text>
<rect x="32" y="1170" width="1360" height="55" rx="10" fill="#eaf3ff" stroke="none" stroke-width="1.6"/>
<text x="52" y="1206" font-size="23" fill="#1456a0" font-weight="700" text-anchor="start">应用层</text>
<text x="240" y="1205" font-size="21" fill="#334e6a" font-weight="400" text-anchor="start">提供网络应用服务，覆盖 OSI 应用层、表示层、会话层的功能。</text>
<rect x="32" y="1229" width="1360" height="55" rx="10" fill="#f1edfa" stroke="none" stroke-width="1.6"/>
<text x="52" y="1265" font-size="23" fill="#734199" font-weight="700" text-anchor="start">传输层</text>
<text x="240" y="1264" font-size="21" fill="#334e6a" font-weight="400" text-anchor="start">进程间端到端通信、端口复用/分用；TCP 提供分段重组、连接管理及可靠性等机制。</text>
<rect x="32" y="1288" width="1360" height="55" rx="10" fill="#e9f7f3" stroke="none" stroke-width="1.6"/>
<text x="52" y="1324" font-size="23" fill="#176b64" font-weight="700" text-anchor="start">网络层</text>
<text x="240" y="1323" font-size="21" fill="#334e6a" font-weight="400" text-anchor="start">逻辑寻址、路由选择、分组转发与网络拥塞控制，实现异构网络互联。</text>
<rect x="32" y="1347" width="1360" height="55" rx="10" fill="#fff3de" stroke="none" stroke-width="1.6"/>
<text x="52" y="1383" font-size="23" fill="#93631e" font-weight="700" text-anchor="start">网络接口层</text>
<text x="240" y="1382" font-size="21" fill="#334e6a" font-weight="400" text-anchor="start">将 IP 数据报封装为帧，经本地链路和物理介质发送；涵盖 OSI 数据链路层、物理层。</text>
</g></svg>