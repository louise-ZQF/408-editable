<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1424" viewBox="0 0 1440 1424" role="img" aria-labelledby="title desc">
<title id="title">408 核心网络协议的 TCP/IP 封装关系</title>
<desc id="desc">DNS、DHCP、RIP 经 UDP，DNS、FTP、SMTP、POP3、HTTP、BGP 经 TCP。协议节点连接端口号，再连接 TCP 或 UDP；TCP、UDP、ICMP、OSPF 分别以 IPv4 协议号 6、17、1、89 封装到 IP。IP 数据报由局域网或广域网链路承载；ARP 单列于网络接口层。</desc>
<rect width="1440" height="1424" fill="#fff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#8297af" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
