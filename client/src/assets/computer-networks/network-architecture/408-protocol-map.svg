<text x="456" y="1054" font-size="20" fill="#334e6a" font-weight="400" text-anchor="start">通过端口寻址、复用/分用，提供应用进程间端到端通信。</text>
<text x="456" y="1080" font-size="20" fill="#334e6a" font-weight="400" text-anchor="start">TCP：分段重组、连接管理、可靠传输、流量与拥塞控制。</text>
<g transform="translate(0,320)">
<rect x="320" y="794" width="446" height="122" rx="14" fill="#eef5ff" stroke="none" stroke-width="1.5"/>
