<text x="340" y="1006" font-size="28" fill="#176b64" font-weight="700" text-anchor="start">IPv4 / IPv6</text>
<text x="340" y="1036" font-size="20" fill="#426d64" font-weight="400" text-anchor="start">地址长度：32 位 / 128 位</text>
