<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="2336" viewBox="0 0 1280 2336" role="img" aria-labelledby="title desc">
<title id="title">408 OSI 七层功能与核心协议对照图</title>
<desc id="desc">每一层均列出本层功能，并与典型协议逐行对齐。应用层提供网络服务，表示层转换数据格式，会话层管理会话，传输层提供进程间通信，网络层寻址与转发，数据链路层传帧，物理层传输比特流。</desc>
<rect width="1280" height="2336" fill="#fff"/>
<g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="40" y="68" font-size="43" fill="#102847" font-weight="750" text-anchor="start">408 计算机网络</text>
<text x="40" y="117" font-size="34" fill="#1456a0" font-weight="650" text-anchor="start">OSI 七层：功能与协议对照</text>
<text x="1240" y="65" font-size="18" fill="#526680" font-weight="600" text-anchor="end">OSI SEVEN LAYERS</text>
<text x="1240" y="109" font-size="20" fill="#526680" font-weight="400" text-anchor="end">每一层独立成行 · 不跨层合并</text>
<line x1="40" y1="137" x2="1240" y2="137" stroke="#d9e3ef" stroke-width="2"/>
<text x="48" y="166" font-size="19" fill="#526680" font-weight="600" text-anchor="start">OSI 层号与层名</text>
<text x="320" y="166" font-size="19" fill="#526680" font-weight="600" text-anchor="start">本层功能 + 典型协议 / 机制</text>
<rect x="32" y="184" width="252" height="390" rx="14" fill="#eaf3ff" stroke="none" stroke-width="1.5"/>
<text x="70" y="399.0" font-size="58" fill="#1456a0" font-weight="700" text-anchor="middle">7</text>
<text x="120" y="374.0" font-size="27" fill="#1456a0" font-weight="700" text-anchor="start">应用层</text>
<text x="120" y="407.0" font-size="17" fill="#526680" font-weight="400" text-anchor="start">网络应用服务</text>
<rect x="300" y="184" width="948" height="390" rx="14" fill="#f6f9ff" stroke="#d9e5f3" stroke-width="1.5"/>
<rect x="320" y="200" width="908" height="64" rx="10" fill="#fff" stroke="#d9e5f3" stroke-width="1.5"/>
<text x="338" y="236" font-size="20" fill="#1456a0" font-weight="700" text-anchor="start">本层功能</text>
<text x="456" y="224" font-size="20" fill="#334e6a" font-weight="400" text-anchor="start">向应用进程提供网络服务，支持网络应用间的信息交换。</text>
<text x="456" y="250" font-size="20" fill="#334e6a" font-weight="400" text-anchor="start">例如网页访问、文件传输、邮件收发、域名解析。</text>
