<text x="340" y="868" font-size="22" fill="#24476f" font-weight="400" text-anchor="start">面向连接 · 可靠 · 字节流</text>
<text x="340" y="899" font-size="20" fill="#526680" font-weight="400" text-anchor="start">流量控制 / 拥塞控制</text>
