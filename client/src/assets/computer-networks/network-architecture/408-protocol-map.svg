<text x="681.0" y="1277" font-size="20" fill="#8b5a18" font-weight="600" text-anchor="middle">GBN</text>
<rect x="742" y="1252" width="94" height="36" rx="8" fill="#fff2d7" stroke="none" stroke-width="1.5"/>
<text x="789.0" y="1277" font-size="20" fill="#8b5a18" font-weight="600" text-anchor="middle">SR</text>
<rect x="320" y="1312" width="908" height="70" rx="14" fill="#fff" stroke="#ebdfcb" stroke-width="1.5"/>
<text x="338" y="1354" font-size="19" fill="#93631e" font-weight="650" text-anchor="start">介质访问</text>
<text x="486" y="1354" font-size="21" fill="#604d32" font-weight="400" text-anchor="start">ALOHA · CSMA · CSMA/CD · CSMA/CA · 令牌传递</text>
<rect x="320" y="1395" width="908" height="63" rx="14" fill="#fff" stroke="#ebdfcb" stroke-width="1.5"/>
