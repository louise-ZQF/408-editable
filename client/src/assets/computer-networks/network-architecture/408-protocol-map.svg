<text x="486" y="1421" font-size="21" fill="#604d32" font-weight="400" text-anchor="start">PPP · 802.3 以太网 · 802.11 无线局域网</text>
<text x="486" y="1449" font-size="20" fill="#604d32" font-weight="400" text-anchor="start">VLAN（802.1Q）</text>
</g>
<rect x="32" y="1972" width="252" height="212" rx="14" fill="#edf2f7" stroke="none" stroke-width="1.5"/>
<text x="70" y="2098.0" font-size="58" fill="#52667e" font-weight="700" text-anchor="middle">1</text>
<text x="120" y="2073.0" font-size="27" fill="#52667e" font-weight="700" text-anchor="start">物理层</text>
<text x="120" y="2106.0" font-size="17" fill="#526680" font-weight="400" text-anchor="start">透明传输比特流</text>
<rect x="300" y="1972" width="948" height="212" rx="14" fill="#f5f7fa" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="320" y="1988" width="908" height="64" rx="10" fill="#fff" stroke="#dce4ee" stroke-width="1.5"/>
<text x="338" y="2024" font-size="20" fill="#52667e" font-weight="700" text-anchor="start">本层功能</text>
<text x="456" y="2012" font-size="20" fill="#334e6a" font-weight="400" text-anchor="start">在物理介质上传送原始比特流。</text>
<text x="456" y="2038" font-size="20" fill="#334e6a" font-weight="400" text-anchor="start">规定接口的机械、电气、功能和过程特性。</text>
<g transform="translate(0,560)">
<text x="320" y="1540" font-size="29" fill="#445a73" font-weight="700" text-anchor="start">比特流</text>
<text x="486" y="1540" font-size="23" fill="#445a73" font-weight="400" text-anchor="start">编码 · 调制 · 传输介质 · 物理接口</text>
<text x="320" y="1590" font-size="22" fill="#526680" font-weight="400" text-anchor="start">典型设备：中继器、集线器</text>
</g><g transform="translate(0,560)">
<text x="40" y="1667" font-size="20" fill="#526680" font-weight="400" text-anchor="start">按 OSI 七层作层级对照；五层模型的应用层覆盖 OSI 的第 7、6、5 层功能。</text>
<text x="40" y="1706" font-size="20" fill="#526680" font-weight="400" text-anchor="start">按实际封装关系归属：DHCP、RIP、BGP 位于第 7 层；ARP 在本图归入第 2 层。</text>
<text x="40" y="1745" font-size="19" fill="#526680" font-weight="400" text-anchor="start">端口号标在应用协议旁；TCP / UDP / ICMP / OSPF 旁标注 IPv4 首部的协议字段值。</text>
</g></g></svg>