<text x="120" y="1130.0" font-size="27" fill="#734199" font-weight="700" text-anchor="start">传输层</text>
<text x="120" y="1163.0" font-size="17" fill="#526680" font-weight="400" text-anchor="start">端到端传输</text>
<rect x="300" y="1014" width="948" height="242" rx="14" fill="#fcfaff" stroke="#e4d9ef" stroke-width="1.5"/>
