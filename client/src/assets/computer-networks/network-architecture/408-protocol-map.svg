<text x="120" y="928.0" font-size="17" fill="#526680" font-weight="400" text-anchor="start">建立与管理会话</text>
<rect x="300" y="802" width="948" height="196" rx="14" fill="#faf9fe" stroke="#e0dcef" stroke-width="1.5"/>
