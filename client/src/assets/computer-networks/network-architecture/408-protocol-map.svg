<rect x="320" y="529" width="228" height="36" rx="8" fill="#e8f1fc" stroke="none" stroke-width="1.5"/>
<text x="434.0" y="554" font-size="22" fill="#356a98" font-weight="600" text-anchor="middle">格式 / 编码转换</text>
<rect x="564" y="529" width="220" height="36" rx="8" fill="#e8f1fc" stroke="none" stroke-width="1.5"/>
<text x="674.0" y="554" font-size="22" fill="#356a98" font-weight="600" text-anchor="middle">压缩 / 解压</text>
<rect x="800" y="529" width="244" height="36" rx="8" fill="#e8f1fc" stroke="none" stroke-width="1.5"/>
<text x="922.0" y="554" font-size="22" fill="#356a98" font-weight="600" text-anchor="middle">加密 / 解密</text>
<text x="320" y="602" font-size="21" fill="#526680" font-weight="400" text-anchor="start">408 侧重理解本层的数据表示与语法转换功能。</text>
</g>
<rect x="32" y="802" width="252" height="196" rx="14" fill="#efedf9" stroke="none" stroke-width="1.5"/>
