<text x="120" y="1398.0" font-size="27" fill="#176b64" font-weight="700" text-anchor="start">网络层</text>
<text x="120" y="1431.0" font-size="17" fill="#526680" font-weight="400" text-anchor="start">寻址与分组转发</text>
<rect x="300" y="1272" width="948" height="262" rx="14" fill="#f2fbf8" stroke="#d6ece5" stroke-width="1.5"/>
<rect x="320" y="1288" width="908" height="64" rx="10" fill="#fff" stroke="#d6ece5" stroke-width="1.5"/>
<text x="338" y="1324" font-size="20" fill="#176b64" font-weight="700" text-anchor="start">本层功能</text>
<text x="456" y="1312" font-size="20" fill="#334e6a" font-weight="400" text-anchor="start">逻辑寻址、路由选择、分组转发与网络拥塞控制。</text>
<text x="456" y="1338" font-size="20" fill="#334e6a" font-weight="400" text-anchor="start">实现异构网络互联，将分组逐跳送向目的主机。</text>
<g transform="translate(0,400)">
