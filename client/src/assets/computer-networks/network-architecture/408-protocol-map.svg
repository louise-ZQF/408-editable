<text x="320" y="734" font-size="21" fill="#526680" font-weight="400" text-anchor="start">408 侧重理解本层的会话控制与同步功能。</text>
</g>
<rect x="32" y="1014" width="252" height="242" rx="14" fill="#f3ecfa" stroke="none" stroke-width="1.5"/>
