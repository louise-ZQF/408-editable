<text x="338" y="235" font-size="20" fill="#1456a0" font-weight="700" text-anchor="start">使用 TCP</text>
<text x="890" y="235" font-size="20" fill="#75429c" font-weight="700" text-anchor="start">使用 UDP</text>
<rect x="338" y="248" width="124" height="36" rx="8" fill="#eaf3ff" stroke="none" stroke-width="1.5"/>
<text x="400.0" y="273" font-size="20" fill="#1456a0" font-weight="600" text-anchor="middle">HTTP · 80</text>
