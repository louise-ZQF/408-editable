<text x="120" y="1748.0" font-size="27" fill="#93631e" font-weight="700" text-anchor="start">数据链路层</text>
<text x="120" y="1781.0" font-size="17" fill="#526680" font-weight="400" text-anchor="start">相邻结点传帧</text>
<rect x="300" y="1550" width="948" height="406" rx="14" fill="#fffbf3" stroke="#eadfc9" stroke-width="1.5"/>
<rect x="320" y="1566" width="908" height="64" rx="10" fill="#fff" stroke="#eadfc9" stroke-width="1.5"/>
<text x="338" y="1602" font-size="20" fill="#93631e" font-weight="700" text-anchor="start">本层功能</text>
<text x="456" y="1590" font-size="20" fill="#334e6a" font-weight="400" text-anchor="start">组帧、MAC 寻址、差错控制和介质访问控制。</text>
<text x="456" y="1616" font-size="20" fill="#334e6a" font-weight="400" text-anchor="start">在相邻结点间传送帧；按具体协议提供流量控制与可靠传输。</text>
