<text x="553.0" y="273" font-size="20" fill="#1456a0" font-weight="600" text-anchor="middle">FTP · 21/20*</text>
<rect x="644" y="248" width="130" height="36" rx="8" fill="#eaf3ff" stroke="none" stroke-width="1.5"/>
<text x="709.0" y="273" font-size="20" fill="#1456a0" font-weight="600" text-anchor="middle">SMTP · 25</text>
<rect x="338" y="296" width="160" height="36" rx="8" fill="#eaf3ff" stroke="none" stroke-width="1.5"/>
<text x="418.0" y="321" font-size="20" fill="#1456a0" font-weight="600" text-anchor="middle">POP3 · 110</text>
<rect x="510" y="296" width="160" height="36" rx="8" fill="#eaf3ff" stroke="none" stroke-width="1.5"/>
<text x="590.0" y="321" font-size="20" fill="#1456a0" font-weight="600" text-anchor="middle">BGP · 179</text>
