<text x="802" y="868" font-size="22" fill="#614078" font-weight="400" text-anchor="start">无连接 · 不保证可靠 · 报文</text>
<text x="802" y="899" font-size="20" fill="#526680" font-weight="400" text-anchor="start">首部 8 字节</text>
</g>
<rect x="32" y="1272" width="252" height="262" rx="14" fill="#e9f7f3" stroke="none" stroke-width="1.5"/>
