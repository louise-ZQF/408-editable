<text x="320" y="1116" font-size="21" fill="#426d64" font-weight="400" text-anchor="start">相关概念：IP 组播、移动 IP。</text>
</g>
<rect x="32" y="1550" width="252" height="406" rx="14" fill="#fff5e3" stroke="none" stroke-width="1.5"/>
