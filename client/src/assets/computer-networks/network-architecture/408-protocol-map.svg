<text x="530" y="399" font-size="22" fill="#384e94" font-weight="400" text-anchor="start">查询常用 UDP；区域传送使用 TCP</text>
<text x="320" y="451" font-size="21" fill="#324d70" font-weight="400" text-anchor="start">MIME：邮件格式扩充，配合电子邮件系统使用。</text>
<text x="320" y="480" font-size="18" fill="#526680" font-weight="400" text-anchor="start">* FTP：21 为控制端口；20 为主动方式数据连接的服务器端口。</text>
</g>
<rect x="32" y="590" width="252" height="196" rx="14" fill="#eef5fd" stroke="none" stroke-width="1.5"/>
<text x="70" y="708.0" font-size="58" fill="#356a98" font-weight="700" text-anchor="middle">6</text>
<text x="120" y="683.0" font-size="27" fill="#356a98" font-weight="700" text-anchor="start">表示层</text>
<text x="120" y="716.0" font-size="17" fill="#526680" font-weight="400" text-anchor="start">处理数据的表示</text>
<rect x="300" y="590" width="948" height="196" rx="14" fill="#f7faff" stroke="#dce7f3" stroke-width="1.5"/>
<rect x="320" y="606" width="908" height="64" rx="10" fill="#fff" stroke="#dce7f3" stroke-width="1.5"/>
<text x="338" y="642" font-size="20" fill="#356a98" font-weight="700" text-anchor="start">本层功能</text>
<text x="456" y="630" font-size="20" fill="#334e6a" font-weight="400" text-anchor="start">统一数据表示与编码，处理不同系统间的数据格式转换。</text>
<text x="456" y="656" font-size="20" fill="#334e6a" font-weight="400" text-anchor="start">压缩与解压、加密与解密。</text>
