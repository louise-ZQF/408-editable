<text x="456" y="842" font-size="20" fill="#334e6a" font-weight="400" text-anchor="start">建立、管理和终止应用进程之间的会话。</text>
<text x="456" y="868" font-size="20" fill="#334e6a" font-weight="400" text-anchor="start">进行对话控制与同步，设置会话检查点。</text>
