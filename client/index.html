<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="408 四科个人可编辑教材：完整原站知识、真题和动画，支持增删改查、备份和 GitHub 发布" />
    <!-- favicon 放在 public/ 根下，Vite 会原样复制到 dist/ 根目录。
         - %BASE_URL% 由 Vite 在构建期替换为 vite.config.ts 里的 base（/postgraduate-exam-website/），
           保证 GitHub Pages 二级目录部署时请求的是正确路径。
         - svg: 现代 Chrome/Firefox/Edge 默认用 48/64px 高分辨率显示
         - ico: 覆盖 Safari / 旧浏览器 / PWA 安装时的降级图标 -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" sizes="any" />
    <link rel="icon" type="image/x-icon" href="%BASE_URL%favicon.ico" />
    <link rel="shortcut icon" type="image/x-icon" href="%BASE_URL%favicon.ico" />
    <title>408 简纲 · 我的可编辑教材</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
